[package]
name = "ruggie"
version = "0.1.0"
edition = "2024"

[dependencies]
# ctru-rs = { git = "https://github.com/rust3ds/ctru-rs", features = ["romfs"] }
mlua = {version = "0.12.2", features = ["lua54"]}
ruggie-lib = { git = "https://github.com/3ds-engine/ruggie-lib" }

[package.metadata.cargo-3ds]
romfs_dir = "romfs"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
